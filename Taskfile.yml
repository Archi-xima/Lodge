# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    cmds:
      - sass --no-charset src/main/resources/com/lodge/css/style.scss:src/main/resources/com/lodge/css/style.css
      - gradle run
  dev:css:
    - sass --watch --no-charset src/main/resources/com/lodge/css/styles.scss:src/main/resources/com/lodge/css/styles.css
