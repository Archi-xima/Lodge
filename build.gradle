plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON persistence for guests, rooms, bookings, bills and users
    implementation 'com.google.code.gson:gson:2.10.1'

    // Encoding / checksum helpers for the foundation utilities
    implementation 'commons-codec:commons-codec:1.15'

    // Logging: SLF4J API at compile time, Logback as the runtime binding
    implementation 'org.slf4j:slf4j-api:2.0.9'
    runtimeOnly 'ch.qos.logback:logback-classic:1.4.11'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // spec listed 5.4.1, which was never published — 5.4.0 is the real 5.4.x release
    testImplementation 'org.mockito:mockito-core:5.4.0'
}

tasks.withType(Test).configureEach {
    useJUnit()
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}

application {
    mainClass = 'com.lodge.MainApp'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

clean {
    delete file(System.getProperty("user.home") + "/.lodge-billing")
}